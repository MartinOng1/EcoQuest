<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoQuest – Daily Quests</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e7d32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #2e7d32;
      --green-light: #4caf50;
      --green-pale: #e8f5e9;
      --white: #ffffff;
      --grey: #757575;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* NAV */
    nav {
      background: var(--green);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .nav-brand {
      font-size: 20px;
      font-weight: 800;
      color: var(--white);
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .nav-brand img { width: 32px; height: 32px; border-radius: 8px; }

    .nav-links { display: flex; gap: 8px; }

    .nav-links a {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .nav-links a:hover, .nav-links a.active { background: rgba(255,255,255,0.2); color: white; }

    /* HEADER CARD */
    .header-card {
      background: var(--green);
      color: white;
      padding: 24px 20px 32px;
      margin-bottom: -16px;
    }

    .header-card h2 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header-card p { font-size: 14px; opacity: 0.85; }

    .stats-row {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .stat-pill {
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* CONTENT */
    .content { padding: 28px 16px 16px; }

    .section-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--grey);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    /* QUEST CARD */
    .quest-card {
      background: var(--white);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.2s;
    }

    .quest-card.completed {
      opacity: 0.6;
    }

    .quest-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .category-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .badge-Reduce { background: #e3f2fd; color: #1565c0; }
    .badge-Reuse { background: #fff8e1; color: #f57f17; }
    .badge-Recycle { background: #e8f5e9; color: #2e7d32; }
    .badge-Rejuvenate { background: #f3e5f5; color: #6a1b9a; }
    .badge-Upcycle { background: #fbe9e7; color: #bf360c; }

    .quest-description {
      font-size: 15px;
      font-weight: 700;
      color: #333;
      flex: 1;
      line-height: 1.4;
    }

    .quest-points {
      font-size: 13px;
      font-weight: 800;
      color: var(--green);
      white-space: nowrap;
    }

    .quest-bottom { display: flex; gap: 10px; align-items: center; }

    .photo-label {
      flex: 1;
      background: var(--green-pale);
      border: 2px dashed var(--green-light);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--green);
      cursor: pointer;
      transition: background 0.2s;
    }

    .photo-label:hover { background: #c8e6c9; }
    .photo-label input { display: none; }

    .photo-preview {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      display: none;
    }

    .complete-btn {
      background: var(--green);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .complete-btn:disabled {
      background: #bdbdbd;
      cursor: not-allowed;
    }

    .complete-btn:not(:disabled):hover { background: var(--green-light); }
    .complete-btn:active { transform: scale(0.97); }

    .completed-stamp {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 800;
      color: var(--green);
    }

    .quest-card.completed .completed-stamp { display: flex; }
    .quest-card.completed .quest-bottom { display: none; }

    /* LOADING */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--grey);
      font-weight: 700;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--green);
      color: white;
      padding: 14px 24px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      transition: transform 0.3s;
      z-index: 999;
      white-space: nowrap;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      background: white;
      display: flex;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
      z-index: 100;
    }

    .bottom-nav a {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      text-decoration: none;
      font-size: 11px;
      font-weight: 800;
      color: var(--grey);
      gap: 4px;
      transition: color 0.2s;
    }

    .bottom-nav a.active { color: var(--green); }
    .bottom-nav a span { font-size: 22px; }
  </style>
</head>
<body>

  <nav>
    <a class="nav-brand" href="index.html">
      <img src="icon-192.png" alt="EcoQuest">
      EcoQuest
    </a>
    <div class="nav-links">
      <a href="#" id="logout-btn">Log out</a>
    </div>
  </nav>

  <div class="header-card">
    <h2>Daily Quests 🌿</h2>
    <p id="date-label">Loading...</p>
    <div class="stats-row">
      <div class="stat-pill">⭐ <span id="points-display">0</span> pts</div>
      <div class="stat-pill">🔥 <span id="streak-display">0</span> day streak</div>
    </div>
  </div>

  <div class="content">
    <div class="section-title">Complete all 3 to keep your streak!</div>
    <div id="quests-container">
      <div class="loading">Loading your quests...</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="bottom-nav">
    <a href="index.html"><span>🏠</span>Home</a>
    <a href="quests.html" class="active"><span>📋</span>Quests</a>
    <a href="profile.html"><span>👤</span>Profile</a>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabase = createClient(
      'https://ejlhwreqymbfbvxasshr.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqbGh3cmVxeW1iZmJ2eGFzc2hyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyNzc1NDUsImV4cCI6MjA5MDg1MzU0NX0.if-ptCOz9z-ZCW1hWBknM3NaN149dQGGPB6ShPV0xOY'
    )

    // Auth check
    const { data: { session } } = await supabase.auth.getSession()
    if (!session) { window.location.href = 'login.html'; }
    const user = session.user

    // Logout
    document.getElementById('logout-btn').onclick = async () => {
      await supabase.auth.signOut()
      window.location.href = 'login.html'
    }

    // Date
    const today = new Date().toISOString().split('T')[0]
    document.getElementById('date-label').textContent = new Date().toLocaleDateString('en-SG', { weekday: 'long', day: 'numeric', month: 'long' })

    // Load profile
    const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single()
    document.getElementById('points-display').textContent = profile.points
    document.getElementById('streak-display').textContent = profile.streak

    // Get today's quests (deterministic based on date seed)
    const { data: allQuests } = await supabase.from('quests').select('*')

    function getDailyQuests(quests, dateStr) {
      // Seed based on date so everyone gets same quests per day
      const seed = dateStr.replace(/-/g, '')
      const categories = ['Reduce', 'Reuse', 'Recycle', 'Rejuvenate', 'Upcycle']
      const selected = []
      const usedIds = new Set()

      // Pick one from each category cyclically based on date
      for (let i = 0; i < 3; i++) {
        const cat = categories[(parseInt(seed) + i) % categories.length]
        const catQuests = quests.filter(q => q.category === cat && !usedIds.has(q.id))
        if (catQuests.length === 0) continue
        const pick = catQuests[(parseInt(seed) + i * 7) % catQuests.length]
        selected.push(pick)
        usedIds.add(pick.id)
      }
      return selected
    }

    const dailyQuests = getDailyQuests(allQuests, today)

    // Check which are already completed today
    const { data: completedToday } = await supabase
      .from('completed_quests')
      .select('quest_id')
      .eq('user_id', user.id)
      .gte('completed_at', today + 'T00:00:00')

    const completedIds = new Set((completedToday || []).map(c => c.quest_id))

    // Render quests
    const container = document.getElementById('quests-container')
    container.innerHTML = ''

    dailyQuests.forEach(quest => {
      const done = completedIds.has(quest.id)
      const card = document.createElement('div')
      card.className = 'quest-card' + (done ? ' completed' : '')
      card.innerHTML = `
        <div class="quest-top">
          <div>
            <span class="category-badge badge-${quest.category}">${quest.category}</span>
          </div>
          <div class="quest-description">${quest.description}</div>
          <div class="quest-points">+${quest.points_value} pts</div>
        </div>
        ${done ? `
          <div class="completed-stamp">✅ Completed!</div>
        ` : `
          <div class="quest-bottom">
            <label class="photo-label">
              📷 Upload photo proof
              <input type="file" accept="image/*" capture="environment" data-quest="${quest.id}">
            </label>
            <img class="photo-preview" id="preview-${quest.id}">
            <button class="complete-btn" id="btn-${quest.id}" data-quest="${quest.id}" data-points="${quest.points_value}" disabled>
              Done!
            </button>
          </div>
        `}
      `
      container.appendChild(card)
    })

    // Photo upload handlers
    document.querySelectorAll('input[type=file]').forEach(input => {
      input.addEventListener('change', e => {
        const file = e.target.files[0]
        if (!file) return
        const questId = e.target.dataset.quest
        const preview = document.getElementById(`preview-${questId}`)
        preview.src = URL.createObjectURL(file)
        preview.style.display = 'block'
        document.getElementById(`btn-${questId}`).disabled = false
      })
    })

    // Complete quest
    document.querySelectorAll('.complete-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const questId = parseInt(btn.dataset.quest)
        const points = parseInt(btn.dataset.points)
        btn.disabled = true
        btn.textContent = 'Saving...'

        // Upload photo to Supabase Storage (optional, skip if no bucket set up)
        const fileInput = document.querySelector(`input[data-quest="${questId}"]`)
        let photoUrl = null

        if (fileInput.files[0]) {
          const file = fileInput.files[0]
          const filename = `${user.id}/${today}/${questId}.jpg`
          const { data: uploadData } = await supabase.storage
            .from('quest-photos')
            .upload(filename, file, { upsert: true })
          if (uploadData) {
            const { data: urlData } = supabase.storage.from('quest-photos').getPublicUrl(filename)
            photoUrl = urlData.publicUrl
          }
        }

        // Record completion
        await supabase.from('completed_quests').insert({
          user_id: user.id,
          quest_id: questId,
          photo_url: photoUrl
        })

        // Update points
        const newPoints = profile.points + points
        profile.points = newPoints

        // Update streak
        const lastCompleted = profile.last_completed
        const yesterday = new Date()
        yesterday.setDate(yesterday.getDate() - 1)
        const yesterdayStr = yesterday.toISOString().split('T')[0]
        const newStreak = (lastCompleted === yesterdayStr || lastCompleted === today)
          ? profile.streak + 1
          : 1

        await supabase.from('profiles').update({
          points: newPoints,
          streak: newStreak,
          last_completed: today
        }).eq('id', user.id)

        document.getElementById('points-display').textContent = newPoints
        document.getElementById('streak-display').textContent = newStreak

        // Mark card as completed
        btn.closest('.quest-card').classList.add('completed')
        btn.closest('.quest-card').querySelector('.quest-bottom').style.display = 'none'
        const stamp = document.createElement('div')
        stamp.className = 'completed-stamp'
        stamp.innerHTML = '✅ Completed!'
        stamp.style.display = 'flex'
        btn.closest('.quest-card').appendChild(stamp)

        showToast(`+${points} points! 🌿`)
      })
    })

    function showToast(msg) {
      const toast = document.getElementById('toast')
      toast.textContent = msg
      toast.classList.add('show')
      setTimeout(() => toast.classList.remove('show'), 2500)
    }
  </script>
</body>
</html>
